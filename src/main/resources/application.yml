server:
  port: ${SERVER_PORT:8080}

node:
  id: ${NODE_ID:1}
  host: ${NODE_HOST:127.0.0.1}

rmi:
  port: ${RMI_PORT:1099}

peers: ${PEERS:}

spring:
  application:
    name: dms-node
  datasource:
    url: jdbc:h2:file:./data/node-${node.id:1}/dms_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
